# Render Blueprint: one free web service serving the API, the web app and the two simulated nodes.
services:
  - type: web
    name: coldchain-monitor
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn coldchain.app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: MQTT_ENABLED
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.11"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ColdChain">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a2b"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3fd6c2"/>
      <stop offset="1" stop-color="#7aa7ff"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <!-- dial track (270°, like the in-app gauge) -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#1f2836" stroke-width="7" stroke-dasharray="197.9 263.9" transform="rotate(135 64 64)" stroke-linecap="round"/>
  <!-- 2-8 °C safe band of a 0-12 °C dial -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="url(#arc)" stroke-width="7" stroke-dasharray="98.96 263.9" stroke-dashoffset="-32.99" transform="rotate(135 64 64)" stroke-linecap="round"/>
  <!-- snowflake -->
  <g stroke="#e8eefc" stroke-width="5.5" stroke-linecap="round" fill="none">
    <path d="M64 40v48M43.2 52l41.6 24M43.2 76l41.6-24"/>
    <path d="M57 44l7 6 7-6M57 84l7-6 7 6" stroke-width="4"/>
  </g>
  <circle cx="64" cy="64" r="5" fill="#3fd6c2"/>
</svg>
